name: Build Raja Cheat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/rajacheat/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          mv MainActivity.java app/src/main/java/com/rajacheat/app/MainActivity.java
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv index.html app/src/main/assets/index.html
          mv strings.xml app/src/main/res/values/strings.xml
          mv themes.xml app/src/main/res/values/themes.xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rajacheat.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.rajacheat.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.13.0'
          }
          EOF

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RajaCheat-Android12
          path: app/build/outputs/apk/debug/app-debug.apk
